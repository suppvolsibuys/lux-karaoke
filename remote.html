<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUX Mobile Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white p-4 font-sans min-h-screen select-none">
    <div class="max-w-md mx-auto space-y-4">
        <header class="text-center border-b border-gray-800 pb-2 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold text-purple-400">LUX Remote</h1>
                <p id="status" class="text-xs text-gray-500">Connecting...</p>
            </div>
            <select id="remoteLang" onchange="switchLanguage(this.value)" class="bg-gray-900 text-xs text-purple-400 font-bold px-2 py-1 rounded-lg border border-gray-800">
                <option value="en">EN</option>
                <option value="ms">MS</option>
                <option value="zh">ZH</option>
            </select>
        </header>

        <div class="flex border-b border-gray-800">
            <button onclick="switchTab('search')" id="tab-search" class="flex-1 py-2 text-xs font-bold border-b-2 border-purple-500 text-purple-400" data-i18n="search">Search</button>
            <button onclick="switchTab('queue')" id="tab-queue" class="flex-1 py-2 text-xs font-bold text-gray-500" data-i18n="queue">Live Queue</button>
        </div>

        <div id="searchView" class="space-y-3">
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="Paste YouTube link or Video ID..." data-i18n-ph="searchPlaceholder" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-purple-500 text-white">
                <button onclick="processMobileInput()" class="bg-purple-600 text-white px-4 rounded-xl text-xs font-bold"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="resultsContainer" class="space-y-2"></div>
        </div>

        <div id="queueView" class="hidden space-y-2" id="queueContainer"></div>
    </div>

    <script>
        const i18nRemote = {
            en: { search: "Add Song", queue: "Live Queue", searchPlaceholder: "Paste YouTube link or Video ID...", added: "Queued!" },
            ms: { search: "Tambah Lagu", queue: "Senarai Lagu", searchPlaceholder: "Tampal pautan YouTube atau ID...", added: "Ditambah!" },
            zh: { search: "点歌", queue: "播放队列", searchPlaceholder: "粘贴YouTube链接或视频ID...", added: "已添加！" }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        let currentLang = urlParams.get('lang') || 'en';
        const peer = new Peer();
        let conn = null;

        function updateRemoteLang() {
            document.getElementById('remoteLang').value = currentLang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nRemote[currentLang][key]) el.innerText = i18nRemote[currentLang][key];
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (i18nRemote[currentLang][key]) el.placeholder = i18nRemote[currentLang][key];
            });
        }

        function switchLanguage(lang) {
            currentLang = lang;
            updateRemoteLang();
        }

        function extractYouTubeId(input) {
            if (!input) return null;
            const str = input.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
            const regExp = /(?:youtube(?:-nocookie)?\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = str.match(regExp);
            return (match && match[1]) ? match[1] : null;
        }

        function processMobileInput() {
            const raw = document.getElementById('searchInput').value;
            const videoId = extractYouTubeId(raw);
            const container = document.getElementById('resultsContainer');

            if (!videoId) {
                container.innerHTML = '<p class="text-xs text-red-400 text-center py-4">Invalid Link or Video ID!</p>';
                return;
            }

            const thumbnail = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            container.innerHTML = `
                <div class="bg-gray-900 border border-purple-500/40 rounded-xl p-2.5 flex justify-between items-center gap-2">
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        <img src="${thumbnail}" alt="Thumb" class="w-12 h-9 object-cover rounded-lg flex-shrink-0">
                        <div class="truncate">
                            <h4 class="text-xs font-bold text-gray-200 truncate">YouTube (${videoId})</h4>
                            <p class="text-[10px] text-gray-500">Ready to Send</p>
                        </div>
                    </div>
                    <button onclick="queueTrack('${videoId}', 'YouTube (${videoId})', 'Mobile')" class="bg-purple-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0">
                        + Queue
                    </button>
                </div>`;
        }

        function queueTrack(src, title, artist) {
            if (!conn) return;
            conn.send({ type: 'QUEUE_TRACK', track: { id: Date.now().toString(), title, artist, src } });
            alert(i18nRemote[currentLang].added);
        }

        peer.on('open', () => {
            if (!roomId) return;
            conn = peer.connect(`lux-karaoke-${roomId}`);
            conn.on('open', () => {
                document.getElementById('status').innerText = `Connected #${roomId}`;
                document.getElementById('status').className = "text-xs text-emerald-400";
            });
            conn.on('data', (data) => {
                if (data.type === 'SYNC_QUEUE') renderQueue(data.queue);
            });
        });

        function renderQueue(queue) {
            const container = document.getElementById('queueView');
            container.innerHTML = '';
            queue.forEach((track, index) => {
                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-gray-800 rounded-xl p-2.5 flex justify-between items-center";
                card.innerHTML = `
                    <div class="flex items-center space-x-2 truncate">
                        <span class="text-xs font-bold text-gray-500">${index + 1}</span>
                        <h4 class="text-xs font-bold text-gray-200 truncate">${track.title}</h4>
                    </div>
                    <button onclick="removeTrack(${index})" class="text-red-500 text-xs p-1"><i class="fa-solid fa-trash"></i></button>`;
                container.appendChild(card);
            });
        }

        function removeTrack(index) { if (conn) conn.send({ type: 'REMOVE_TRACK', index }); }

        function switchTab(tab) {
            ['search', 'queue'].forEach(t => {
                document.getElementById(`${t}View`).classList.toggle('hidden', t !== tab);
                document.getElementById(`tab-${t}`).className = t === tab ? 
                    "flex-1 py-2 text-xs font-bold border-b-2 border-purple-500 text-purple-400" : 
                    "flex-1 py-2 text-xs font-bold text-gray-500";
            });
        }

        updateRemoteLang();
    </script>
</body>
</html>
